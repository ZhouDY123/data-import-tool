<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单导入台</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="shell">
    <header class="hero"><div><p class="eyebrow">三奇数据看板 / 外部订单</p><h1>订单导入台</h1><p class="intro">从三个店铺获取当前附件，校验后导入。重复的“平台 + 店铺 + 订单号 + SKU”会更新已有记录。</p></div><div class="stamp"><span>导入流水线</span><b>下载 → 解析 → 导入</b></div></header>
    <section class="credential-card" aria-labelledby="credential-title"><div><p class="eyebrow">连接后台</p><h2 id="credential-title">登录信息仅用于本次获取</h2></div><form id="credential-form" novalidate><label>后台账号<input id="username" autocomplete="username" value="admin" required></label><label>后台密码<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button id="toggle-password" type="button" aria-label="显示密码">显示</button></div></label><button id="preview-all" class="button primary" type="submit">获取并解析全部附件</button></form></section>
    <section class="stores" aria-label="店铺附件"><article class="store-card" data-store="jd"><div class="store-head"><span class="store-dot jd"></span><div><p>店铺一</p><h2>京东 · 三奇旗舰店</h2></div></div><dl><div><dt>附件</dt><dd class="attachment">尚未获取</dd></div><div><dt>目标接口</dt><dd>京东订单</dd></div></dl><label class="data-type-field">数据类型<select class="data-type"><option value="real">真实数据</option><option value="virtual">虚拟数据</option></select></label><div class="card-actions"><button class="button outline preview-one" type="button">获取并解析</button><button class="button import" type="button" disabled>导入订单</button></div><p class="card-status" role="status">等待获取附件。</p></article>
    <article class="store-card" data-store="tmall"><div class="store-head"><span class="store-dot tmall"></span><div><p>店铺二</p><h2>天猫 · 三奇旗舰店</h2></div></div><dl><div><dt>附件</dt><dd class="attachment">尚未获取</dd></div><div><dt>目标接口</dt><dd>天猫订单</dd></div></dl><label class="data-type-field">数据类型<select class="data-type"><option value="real">真实数据</option><option value="virtual">虚拟数据</option></select></label><div class="card-actions"><button class="button outline preview-one" type="button">获取并解析</button><button class="button import" type="button" disabled>导入订单</button></div><p class="card-status" role="status">等待获取附件。</p></article>
    <article class="store-card" data-store="pdd"><div class="store-head"><span class="store-dot pdd"></span><div><p>店铺三</p><h2>拼多多 · 三奇旗舰店</h2></div></div><dl><div><dt>附件</dt><dd class="attachment">尚未获取</dd></div><div><dt>目标接口</dt><dd>拼多多订单</dd></div></dl><label class="data-type-field">数据类型<select class="data-type"><option value="real">真实数据</option><option value="virtual">虚拟数据</option></select></label><div class="card-actions"><button class="button outline preview-one" type="button">获取并解析</button><button class="button import" type="button" disabled>导入订单</button></div><p class="card-status" role="status">等待获取附件。</p></article></section>
    <section id="detail" class="detail hidden" aria-live="polite"><div class="detail-title"><div><p class="eyebrow">解析预览</p><h2 id="detail-heading">尚未解析附件</h2></div><p id="detail-summary"></p></div><div id="error-panel" class="errors hidden"></div><div class="table-wrap"><table><thead><tr><th>订单号</th><th>成交时间</th><th>SKU</th><th>商品</th><th>金额</th><th>数量</th><th>地区</th></tr></thead><tbody id="preview-rows"></tbody></table></div></section>
  </main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body></html>
